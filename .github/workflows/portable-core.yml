name: Portable core

on:
  push:
    branches: [feature/portable-clients]
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - Scripts/**
      - Config/**
      - Resources/**
      - .github/workflows/portable-core.yml
  pull_request:
    branches: [main, feature/portable-clients]
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - Scripts/**
      - Config/**
      - Resources/**
      - .github/workflows/portable-core.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 16.4 (Swift 6.1.2)
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Install Swift 6.1.2 on Linux
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@7591e4f04c00624cb043783da51a7fd6ee0a6bf6 # v2
        with:
          swift-version: '6.1.2'
      - name: Install Swift 6.1.2 on Windows
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE
      - name: Record compiler
        run: swift --version
      - name: Build shared core
        run: swift build --target QCore
      - name: Run tests (including Mac device tests on macOS)
        run: swift test
      - name: Compile optimized products
        run: swift build --configuration release
      - name: Exercise Linux native serial I/O with a pseudo-terminal
        if: runner.os == 'Linux'
        run: python3 Scripts/test-portable-pty.py "$(swift build --configuration release --show-bin-path)/q"
      - name: Package Windows development CLI
        if: runner.os == 'Windows'
        run: ./Scripts/package-portable.ps1
      - name: Package Linux development CLI
        if: runner.os == 'Linux'
        run: sh Scripts/package-portable-linux.sh
      - name: Upload development CLI (not a release)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q-cli-${{ runner.os }}-${{ github.sha }}
          path: |
            .build/packages/*.zip
            .build/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  mac-regression:
    name: Mac existing build scripts
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile current universal binaries with the existing fallback
        run: sh Scripts/build-local.sh release
      - name: Package and verify the existing Mac app
        env:
          Q_BUILD_BINARY: ${{ github.workspace }}/.build/manual-release/Q
        run: |
          sh Scripts/package-app.sh release
          for executable in Q QDeviceWatcher QClaudeHook; do
            lipo ".build/Q.app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          done
          codesign --verify --deep --strict .build/Q.app

# These jobs validate this branch. They do not publish releases, install the
# app, flash hardware, change branch protection or gate the Mac release job.
