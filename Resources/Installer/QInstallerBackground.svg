<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#f1f2f5"/>
    </linearGradient>
    <linearGradient id="dropzone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/>
      <stop offset="1" stop-color="#dce9fb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#526579" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#background)"/>
  <text x="320" y="48" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="21" font-weight="650" fill="#17181a">Install Q</text>
  <text x="320" y="74" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="13" fill="#74777d">Drag Q into Applications</text>

  <rect x="188" y="292" width="264" height="150" rx="28"
        fill="url(#dropzone)" stroke="#c9dcf7" stroke-width="1" filter="url(#shadow)"/>

  <path d="M320 203 L320 258" fill="none" stroke="#2684ff" stroke-width="12"
        stroke-linecap="round"/>
  <path d="M289 240 L320 271 L351 240" fill="none" stroke="#2684ff"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
